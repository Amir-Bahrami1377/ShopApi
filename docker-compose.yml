services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd}"
    ports:
      - "${SQL_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa
          -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: >-
        Server=db,1433;Database=ProductOrderDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd};Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=True
      Database__MigrateOnStartup: "true"
      Database__SeedOnStartup: "true"
      Payment__Mode: "${PAYMENT_MODE:-Success}"
      Payment__ArtificialDelayMilliseconds: "${PAYMENT_DELAY_MS:-100}"
      Payment__TimeoutSeconds: "${PAYMENT_TIMEOUT_SECONDS:-5}"
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  sqlserver-data:
